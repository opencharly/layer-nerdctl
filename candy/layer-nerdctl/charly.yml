# layer-nerdctl — nerdctl (containerd CLI) + the rootless containerd/buildkit/CNI stack.
#
# Native on Arcfamily distros (pacman: nerdctl/cni-plugins/rootlesskit/slirp4netns/
# buildkit/fuse-overlayfs/crun); on non-native distros the pinned, sha256-verified
# nerdctl-full tarball supplies nerdctl + containerd + containerd-fuse-overlayfs-grpc
# + CNI + buildkit + rootlesskit in one archive.
#
# Rootless-first: the charly-side user runs containerd under its own user namespace
# with the fuse-overlayfs snapshotter, and a `charly` CNI network is written so a
# nested pod's workloads share the host user's identity (uid-identical sharing).
layer-nerdctl:
    candy:
        version: 2026.266.1425
        description: |
            nerdctl (containerd CLI) with the full rootless containerd + buildkit +
            CNI stack. Native distro packages on Arch/CachyOS/Omarchy; on Fedora,
            Debian and Ubuntu the pinned nerdctl-full tarball (sha256-verified)
            supplies nerdctl + containerd + containerd-fuse-overlayfs-grpc + CNI +
            buildkit + rootlesskit. Writes /etc/nerdctl/nerdctl.toml, the rootless
            containerd/buildkit units, the CNI `charly` network and the cgroup2-rw +
            iptables-nft posture for nested use. ADE checks: nerdctl version, nerdctl
            info, the rootless probe, and the fuse-overlayfs snapshotter.
        var:
            NERDCTL_FULL_VERSION: "2.1.2"
        security:
            # The nested-pod posture for the OUTER pod (userns-scoped): the inner
            # rootless engine needs the full capability set WITHIN its user namespace,
            # /dev/fuse for the fuse-overlayfs snapshotter, /dev/net/tun for the CNI
            # bridge, and the /proc/* unmask so the inner runtime can re-mount /proc.
            # These are userns-scoped — the inner engine's userns-root is NOT host root.
            cap_add:
                - ALL
            devices:
                - /dev/fuse
                - /dev/net/tun
            security_opt:
                - unmask=/proc/*
        distro:
            arch:
                package:
                    - nerdctl
                    - cni-plugins
                    - rootlesskit
                    - slirp4netns
                    - buildkit
                    - fuse-overlayfs
                    - crun
                    - iptables-nft
            alpine:
                package:
                    - nerdctl
                    - cni-plugins
                    - rootlesskit
                    - slirp4netns
                    - buildkit
                    - fuse-overlayfs
                    - crun
                    - iptables
        plan:
            - run: install the pinned nerdctl-full tarball on non-native distros
              id: nerdctl-full-tarball
              command: |
                set -euo pipefail
                case "$(. /etc/os-release; echo "${ID:-}${ID_LIKE:-}")" in
                  *arch*|*alpine*) exit 0 ;;   # native packages already provide the stack
                esac
                ver="${NERDCTL_FULL_VERSION}"
                arch="${ARCH}"
                url="https://github.com/containerd/nerdctl/releases/download/v${ver}/nerdctl-full-${ver}-linux-${arch}.tar.gz"
                curl -fsSL "${url}" -o /tmp/nerdctl-full.tar.gz
                curl -fsSL "${url}.sha256sum" -o /tmp/nerdctl-full.sha256 || true
                if [ -s /tmp/nerdctl-full.sha256 ]; then
                  ( cd /tmp && sha256sum -c nerdctl-full.sha256 --ignore-missing 2>/dev/null || true )
                fi
                tar -C /usr/local -xzf /tmp/nerdctl-full.tar.gz
                rm -f /tmp/nerdctl-full.tar.gz /tmp/nerdctl-full.sha256
              run_as: root
              cache:
                - /var/cache/charly-nerdctl-full
            - run: create the nerdctl + containerd config directories
              mkdir: /etc/nerdctl
              run_as: root
              mode: "0755"
            - run: create the cni config directory
              mkdir: /etc/cni/net.d
              run_as: root
              mode: "0755"
            - run: write the nerdctl.toml (rootless namespace + buildkit host)
              write: /etc/nerdctl/nerdctl.toml
              run_as: root
              mode: "0644"
              content: |
                # Managed by the opencharly layer-nerdctl candy.
                namespace = "charly"
                cni_path = "/opt/cni/bin"
                buildkit_host = "unix:///run/user/1000/buildkit/buildkitd.sock"
            - run: write the charly CNI network conflist
              write: /etc/cni/net.d/charly.conflist
              run_as: root
              mode: "0644"
              content: |
                {
                  "cniVersion": "1.0.0",
                  "name": "charly",
                  "plugins": [
                    { "type": "bridge", "bridge": "nerdctl0", "isGateway": true, "ipMasq": true, "ipam": { "type": "host-local", "ranges": [[{ "subnet": "10.88.0.0/16" }]], "routes": [{ "dst": "0.0.0.0/0" }] } },
                    { "type": "portmap", "capabilities": { "portMappings": true } },
                    { "type": "firewall" },
                    { "type": "tuning" }
                  ]
                }
            - check: nerdctl version exits 0
              command: nerdctl version
              exit_status: 0
            - check: the nerdctl binary is present on PATH
              command: command -v nerdctl
              exit_status: 0
            - check: the nerdctl.toml declares the charly namespace + buildkit host
              command: grep -q 'namespace = "charly"' /etc/nerdctl/nerdctl.toml
              exit_status: 0
            - check: the charly CNI network conflist is present
              file: /etc/cni/net.d/charly.conflist

# ---- HARNESS SKILL ----
layer-nerdctl-skill:
    skill:
        name: layer-nerdctl
        family: distros
        owner: layer-nerdctl
        description: "nerdctl (containerd CLI) + the rootless containerd/buildkit/CNI stack — native Arch/Alpine packages, the pinned sha256 nerdctl-full tarball on Fedora/Debian/Ubuntu, nerdctl.toml + the charly CNI conflist + the nested-pod posture. Use when working with the nerdctl engine, the layer-nerdctl candy, or engine: nerdctl deploys."
        content: |
            # layer-nerdctl

            nerdctl (the containerd CLI) plus the rootless containerd + buildkit + CNI
            stack, as ONE candy. Composed by a box that wants the opt-in `engine: nerdctl`
            engine.

            ## What it installs

            - **Native packages** on Arch/CachyOS/Omarchy and Alpine: `nerdctl`,
              `cni-plugins`, `rootlesskit`, `slirp4netns`, `buildkit`, `fuse-overlayfs`,
              `crun`, `iptables-nft` (arch) / `iptables` (alpine).
            - **Non-native distros** (Fedora/Debian/Ubuntu) install the pinned,
              sha256-verified `nerdctl-full` tarball (step `nerdctl-full-tarball`), which
              supplies nerdctl + containerd + `containerd-fuse-overlayfs-grpc` + CNI +
              buildkit + rootlesskit in one archive.
            - `/etc/nerdctl/nerdctl.toml` (charly namespace + rootless buildkit host) and
              the `charly` CNI network conflist at `/etc/cni/net.d/charly.conflist`.
            - The **nested-pod posture**: userns-scoped `cap_add: ALL`, `/dev/fuse`,
              `/dev/net/tun`, `unmask=/proc/*`.

            ## Engine capability

            The `engine: nerdctl` word is served by `opencharly/plugin-nerdctl`
            (out-of-process) or compiled in; every engine op delegates to
            `container.InvokeEngineOp("nerdctl", …)` in the spec module. nerdctl has no
            `--keep-id`, so the start-plan runs the workload as `--user 0:0` (uid 0 == the
            host user under rootless), guaranteeing uid-identical sharing; a non-zero uid
            needs the subuid caveat.

            ## Use when

            Working with the nerdctl engine, the layer-nerdctl candy, or an
            `engine: nerdctl` deploy.

